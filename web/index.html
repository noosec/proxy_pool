<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProxyPool 代理面板</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a2029; --border: #2a3644; --text: #d7e0ea;
    --muted: #8b98a8; --accent: #4da3ff; --green: #31c48d; --amber: #f0b429;
    --red: #f05252; --chip: #243040;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  header h1 { font-size: 20px; margin: 0; }
  header .sub { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  .btn { background: var(--panel); color: var(--text); border: 1px solid var(--border);
         border-radius: 8px; padding: 7px 14px; cursor: pointer; font-size: 13px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #04121f; font-weight: 600; }
  .grid { display: grid; gap: 14px; }
  .cards { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .card .k { color: var(--muted); font-size: 12px; }
  .card .v { font-size: 28px; font-weight: 700; margin-top: 4px; }
  .card .v small { font-size: 13px; font-weight: 400; color: var(--muted); }
  .col2 { grid-template-columns: 1fr 1fr; }
  .box { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .box h2 { font-size: 14px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  td.mono, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .bar-row { display: flex; align-items: center; gap: 10px; }
  .bar-row .name { width: 90px; flex-shrink: 0; }
  .bar { flex: 1; background: var(--chip); height: 10px; border-radius: 5px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .bar-row .num { width: 44px; text-align: right; color: var(--muted); }
  .chip { display: inline-block; background: var(--chip); border-radius: 6px; padding: 1px 7px; font-size: 11px; }
  .chip.https { color: var(--green); }
  .chip.socks5 { color: var(--amber); }
  .chip.socks4 { color: #c7a0ff; }
  .chip.http { color: var(--accent); }
  .chip.multi { color: #ff8f6b; }
  .get-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, input[type=checkbox] { background: var(--panel); color: var(--text);
         border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 13px; }
  .result { margin-top: 12px; }
  .result pre { background: var(--chip); border-radius: 8px; padding: 12px; overflow: auto; font-size: 12px; margin: 0; }
  .log { background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
         padding: 10px 12px; height: 220px; overflow: auto; font-size: 12px; }
  .log div { white-space: pre-wrap; word-break: break-all; font-family: ui-monospace, Menlo, monospace; }
  .log .info { color: #9fb0c3; } .log .warn { color: var(--amber); } .log .err { color: var(--red); }
  .muted { color: var(--muted); }
  .status { font-size: 12px; color: var(--muted); }
  @media (max-width: 640px) { .col2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ProxyPool 代理面板</h1>
    <span class="sub">实时统计 · 来源分布 · 获取代理</span>
    <span class="spacer"></span>
    <span class="status" id="lastUpdate"></span>
    <label class="status"><input type="checkbox" id="autoRefresh" checked> 自动刷新</label>
    <a class="btn" href="/api-docs">API 文档</a>
  </header>

  <div class="grid cards" id="cards"></div>

  <div class="grid col2" style="margin-top:14px;">
    <div class="box">
      <h2>来源分布</h2>
      <div id="sources"></div>
    </div>
    <div class="box">
      <h2>地域分布</h2>
      <div id="regions"></div>
    </div>
  </div>

  <div class="box" style="margin-top:14px;">
    <h2>获取代理</h2>
    <div class="get-row">
      <select id="getType">
        <option value="">随机</option>
        <option value="https">HTTPS</option>
        <option value="http">HTTP</option>
        <option value="socks5">SOCKS5</option>
        <option value="socks4">SOCKS4</option>
      </select>
      <select id="getRegion">
        <option value="">全部地域</option>
      </select>
      <label class="status"><input type="checkbox" id="getCheck" checked> 现场拨测 (check=1)</label>
      <button class="btn primary" onclick="getProxy()">获取一个代理</button>
    </div>
    <div class="result"><pre id="proxyResult" class="mono">尚未获取</pre></div>
  </div>

  <div class="grid col2" style="margin-top:14px;">
    <div class="box">
      <h2>采集日志 (fetcher)</h2>
      <div class="log" id="fetchLog">加载中…</div>
    </div>
    <div class="box">
      <h2>校验日志 (checker)</h2>
      <div class="log" id="checkLog">加载中…</div>
    </div>
  </div>

  <div class="box" style="margin-top:14px;">
    <h2>最近代理（前 20）</h2>
    <div style="overflow-x:auto;">
      <table id="recentTable">
        <thead><tr><th>代理</th><th>协议</th><th>HTTPS</th><th>来源</th><th>地域</th><th>最后校验</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<script>
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function protoChip(p){
  var c = p || 'http';
  if (c === 'multi') c = 'multi';
  return '<span class="chip ' + esc(c) + '">' + esc(c) + '</span>';
}

function fillRegionOptions(regs){
  var sel = el('getRegion');
  var cur = sel.value;
  var opts = '<option value="">全部地域</option>';
  (regs || []).forEach(function(s){
    var code = s[0];
    if (!code || code === '未知') return;
    opts += '<option value="'+esc(code)+'">'+esc(code)+' ('+s[1]+')</option>';
  });
  sel.innerHTML = opts;
  if (cur) sel.value = cur; // 自动刷新后保留已选地域
}

function renderStats(d){
  var bp = d.by_proto || {};
  var cards = [
    {k:'代理总数', v:(d.total||0)},
    {k:'HTTPS 可用', v:(d.https||0)},
    {k:'HTTP 协议', v:(bp.http||0)},
    {k:'SOCKS5', v:(bp.socks5||0)},
    {k:'SOCKS4', v:(bp.socks4||0)}
  ];
  if (bp.multi) cards.push({k:'多协议 multi', v:bp.multi});
  el('cards').innerHTML = cards.map(function(c){
    return '<div class="card"><div class="k">'+c.k+'</div><div class="v">'+c.v+'</div></div>';
  }).join('');

  var srcs = d.by_source || [];
  var max = srcs.length ? srcs[0][1] : 1;
  el('sources').innerHTML = srcs.length ? srcs.map(function(s){
    var pct = Math.max(2, Math.round(s[1]/max*100));
    return '<div class="bar-row"><div class="name">'+esc(s[0])+'</div>' +
      '<div class="bar"><i style="width:'+pct+'%"></i></div>' +
      '<div class="num">'+s[1]+'</div></div>';
  }).join('') : '<div class="muted">暂无数据</div>';

  var regs = (d.by_region || []).slice(0, 20);
  var rmax = regs.length ? regs[0][1] : 1;
  el('regions').innerHTML = regs.length ? regs.map(function(s){
    var pct = Math.max(2, Math.round(s[1]/rmax*100));
    return '<div class="bar-row"><div class="name">'+esc(s[0])+'</div>' +
      '<div class="bar"><i style="width:'+pct+'%"></i></div>' +
      '<div class="num">'+s[1]+'</div></div>';
  }).join('') : '<div class="muted">暂无数据</div>';
  fillRegionOptions(regs);

  var recent = d.recent || [];
  var tb = el('recentTable').querySelector('tbody');
  tb.innerHTML = recent.length ? recent.map(function(p){
    return '<tr><td class="mono">'+esc(p.proxy)+'</td><td>'+protoChip(p.proto)+'</td>' +
      '<td>'+(p.https ? '<span class="chip https">是</span>' : '<span class="chip">—</span>')+'</td>' +
      '<td>'+esc(p.source)+'</td><td>'+esc(p.region)+'</td>' +
      '<td class="muted">'+(p.last_status ? '可用' : '失效')+' @ '+esc(p.last_time)+'</td></tr>';
  }).join('') : '<tr><td colspan="6" class="muted">暂无数据</td></tr>';

  renderLog('fetchLog', d.fetch_log);
  renderLog('checkLog', d.check_log);
  el('lastUpdate').textContent = '更新于 ' + new Date().toLocaleTimeString();
}

function renderLog(id, lines){
  if (!lines || !lines.length){ el(id).innerHTML = '<div class="muted">暂无日志</div>'; return; }
  el(id).innerHTML = lines.map(function(l){
    var cls = 'info';
    if (l.indexOf('ERROR') >= 0) cls = 'err';
    else if (l.indexOf('WARNING') >= 0) cls = 'warn';
    return '<div class="'+cls+'">'+esc(l)+'</div>';
  }).join('');
  el(id).scrollTop = el(id).scrollHeight;
}

function loadStats(){
  fetch('/stats').then(function(r){ return r.json(); }).then(renderStats)
    .catch(function(e){ el('fetchLog').innerHTML = '<div class="err">加载失败: '+esc(e)+'</div>'; });
}

function getProxy(){
  var type = el('getType').value;
  var region = el('getRegion').value;
  var check = el('getCheck').checked;
  var qs = [];
  if (type) qs.push('type=' + encodeURIComponent(type));
  if (region) qs.push('region=' + encodeURIComponent(region));
  if (check) qs.push('check=1');
  var url = '/get/' + (qs.length ? '?' + qs.join('&') : '');
  el('proxyResult').textContent = '获取中…' + (check ? '（现场拨测最多 6 个，可能需数秒）' : '');
  fetch(url).then(function(r){
    return r.text().then(function(t){
      try { return JSON.parse(t); }
      catch (e) { throw new Error('后台返回非 JSON 响应 (HTTP ' + r.status + ')，请稍后重试'); }
    });
  }).then(function(d){
    if (d && d.proxy) {
      var lines = [
        'proxy:   ' + d.proxy,
        'proto:   ' + (d.proto || 'http'),
        'https:   ' + (d.https ? '是' : '否'),
        'source:  ' + (d.source || ''),
        'region:  ' + (d.region || ''),
        'check:   ' + (d.last_status ? '可用' : '—') + (d.last_time ? ' @ ' + d.last_time : '')
      ];
      el('proxyResult').textContent = lines.join('\n');
    } else if (d && d.src && d.src.indexOf('no usable proxy') >= 0) {
      el('proxyResult').textContent = '现场拨测未找到可用代理（已尝试并剔除 ' + (d.tried || 6) + ' 个），请稍后重试';
    } else {
      el('proxyResult').textContent = '暂无可用代理';
    }
  }).catch(function(e){ el('proxyResult').textContent = '获取失败: ' + e.message; });
}

el('autoRefresh').addEventListener('change', function(){
  if (this.checked){ loadStats(); startAuto(); } else { stopAuto(); }
});

var timer = null;
function startAuto(){ if (!timer) timer = setInterval(loadStats, 10000); }
function stopAuto(){ if (timer){ clearInterval(timer); timer = null; } }

loadStats();
startAuto();
</script>
</body>
</html>
